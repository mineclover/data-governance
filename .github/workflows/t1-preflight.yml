name: DPM T1 preflight

on:
  pull_request:
    paths:
      - ".github/workflows/t1-preflight.yml"
      - "docs/internal/goals/**"
      - "packages/dpm/**"
      - "packages/openapi-projection-contract/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidate:
    name: Verify private T1 candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out private candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Check extraction boundary
        run: pnpm check:boundary

      - name: Check owner documentation links
        run: pnpm check:docs

      - name: Check roadmap checkpoint
        run: pnpm check:roadmap

      - name: Check operational change decision
        run: pnpm check:operational-change

      - name: Check cross-definition read-model contract
        run: pnpm check:read-model-contract

      - name: Check read-model activation packet
        run: pnpm check:read-model-activation

      - name: Check T1 readiness
        run: pnpm check:t1-readiness

      - name: Run tests
        run: pnpm test

      - name: Run DPM consumer smoke
        run: pnpm smoke:dpm
