name: Publish DPM package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: Stage npm package
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify package tarball
        run: pnpm --filter @oa-sdk/dpm smoke:pack

      - name: Stage package through npm Trusted Publishing
        working-directory: packages/dpm
        run: npm stage publish
