name: DPM T1 release approval
description: Record the owner approval required before the first public DPM artifact release.
title: "[DPM] T1 release approval"
body:
  - type: markdown
    attributes:
      value: |
        Use this issue only when a T1 candidate has passed preflight and the owner is
        ready to decide whether to authorize the first public artifact release.

        Opening this issue does not publish a package, create a release tag, or authorize adapter
        cutover. Those actions require the completed approval below.

        Reference: https://github.com/mineclover/data-governance/blob/main/docs/internal/goals/t1-readiness.md

  - type: input
    id: candidate-source
    attributes:
      label: Candidate source
      description: Branch or pull request used for the candidate. The workflow run records the resolved revision automatically.
      placeholder: "main or pull request URL"
    validations:
      required: true

  - type: input
    id: preflight-run
    attributes:
      label: T1 preflight run
      description: Link the successful T1 preflight or owner CI run for the candidate source.
      placeholder: "https://github.com/mineclover/data-governance/actions/runs/..."
    validations:
      required: true

  - type: textarea
    id: package-policy
    attributes:
      label: Package and registry policy
      description: Record the exact package identity, registry scope, and publication target.
      placeholder: |
        Package: @context-action/dpm
        Registry: npmjs.com / GitHub Packages / other
        Existing @oa-sdk/dpm compatibility policy: ...
    validations:
      required: true

  - type: textarea
    id: license-policy
    attributes:
      label: License and redistribution policy
      description: Record the license and redistribution decision for this public artifact.
      placeholder: "License: ...; redistribution constraints: ..."
    validations:
      required: true

  - type: textarea
    id: compatibility-policy
    attributes:
      label: Compatibility and adapter policy
      description: Define the one-release compatibility window, deprecation notice, and adapter cutover conditions.
      placeholder: "Compatibility release, deprecation notice, rollback, and cutover plan"
    validations:
      required: true

  - type: input
    id: release-reference
    attributes:
      label: Release reference
      description: State the exact SemVer tag or GitHub Release reference to create after approval.
      placeholder: "v0.1.1 or GitHub Release URL"
    validations:
      required: true

  - type: checkboxes
    id: approval-gates
    attributes:
      label: Approval gates
      description: Check only after reviewing the linked evidence.
      options:
        - label: The candidate source is on main or an authorized branch and the linked preflight/owner CI passed.
          required: true
        - label: Package identity, registry scope, and publication target are approved.
          required: true
        - label: License and redistribution policy are approved.
          required: true
        - label: Compatibility, deprecation, rollback, and adapter cutover policy are approved.
          required: true
        - label: I am the mineclover repository owner or an explicitly delegated release authority.
          required: true

  - type: checkboxes
    id: final-approval
    attributes:
      label: Final decision
      options:
        - label: I approve creating the exact release reference above and proceeding through the T1 release gate.
          required: true
